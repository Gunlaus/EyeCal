name: Build CalibGuide

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = '1.4.321.0'
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK.exe'
          $sdk = Join-Path $env:RUNNER_TEMP 'VulkanSDK'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          $process = Start-Process $installer -ArgumentList @('--root', ('"' + $sdk + '"'), '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK install failed: $($process.ExitCode)" }
          if (!(Test-Path "$sdk/Bin/glslc.exe")) { throw "glslc was missing after Vulkan SDK install" }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Run CPU checks
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: CalibGuide-Windows-x64
          path: build/Release/CalibGuide.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSDL_WAYLAND=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run CPU checks
        run: ctest --test-dir build --output-on-failure
